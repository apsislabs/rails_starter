name: Lint and Test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      ruby: ${{ steps.filter.outputs.ruby }}
      js: ${{ steps.filter.outputs.js }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      # For pull requests it's not necessary to checkout the code, for main it is
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ruby:
              - 'app/**'
              - 'config/**'
              - 'lib/**'
              - 'db/**'
              - 'spec/**'
              - 'vendor/**'
              - 'Gemfile'
              - 'Gemfile.lock'
            js:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '**/*.html'
              - '**/*.yml'
              - '**/*.yaml'
            terraform:
              - 'terraform/**'
  lint_ruby:
    name: Run Ruby Linters
    if: ${{ needs.changes.outputs.ruby == 'true' }}
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4"
          bundler-cache: true

      - name: Rubocop
        run: |
          bundle exec rubocop
  lint_js:
    name: Run JS Linters
    if: ${{ needs.changes.outputs.js == 'true' }}
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install
        run: |
          npm ci
      - name: Prettier
        run: |
          npm run prettier:check
  terraform_format:
    name: Run Terraform Formatting
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Run terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive .
  terraform_tflint:
    name: Run Terraform Linting
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        name: Setup TFLint
      - name: Show version
        run: tflint --version
      - name: Init TFLint
        run: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run TFLint
        working-directory: terraform
        run: tflint --recursive -f compact
  terraform_trivy:
    name: Run Terraform Security
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "./terraform"
          trivy-config: "./terraform/trivy.yaml"
          trivyignores: "./terraform/.trivyignore"
